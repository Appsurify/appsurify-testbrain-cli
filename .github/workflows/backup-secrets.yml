name: Backup GitHub Secrets to Artifact

on:
  push:
    branches:
      - "development"
  workflow_dispatch:
    inputs:
      artifact_name:
        description: "Artifact name"
        type: string
        default: "secrets-backup"
      retention_days:
        description: "Artifact retention days"
        type: number
        default: 1

jobs:
  backup:
    runs-on: ubuntu-latest

    # 1) ВАЖНО: здесь ЯВНО перечисли секреты, которые хочешь сохранить
    #    Слева — имя переменной окружения (и ключ в итоговом файле),
    #    справа — значение из GitHub Secrets.
    env:
      # === EDIT ME: перечисли свои секреты ===
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
      # Опционально: пароль для симметричного шифрования GPG (если задан — будет шифрование)
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      # Список имён (ключей), которые нужно выгрузить в файл:
      SECRET_NAMES: "DOCKERHUB_USERNAME DOCKERHUB_TOKEN PYPI_TOKEN"

    steps:
      - name: Prepare workspace
        run: |
          mkdir -p backup
          : > backup/secrets.txt
          chmod 600 backup/secrets.txt

      - name: Write secrets to file (no console output)
        shell: bash
        run: |
          set -euo pipefail
          # Перебираем ключи из SECRET_NAMES, читаем значения из env и пишем в файл
          for NAME in ${SECRET_NAMES}; do
            # Косвенная разыменовка переменной окружения по имени
            VALUE="${!NAME-}"
            # Пишем как KEY=VALUE без вывода в консоль
            printf '%s=%s\n' "$NAME" "$VALUE" >> backup/secrets.txt
          done

      - name: Optionally encrypt with GPG (symmetric AES256)
        id: maybe_encrypt
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${BACKUP_PASSPHRASE:-}" ]]; then
            gpg --version >/dev/null 2>&1
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "$BACKUP_PASSPHRASE" \
                --symmetric --cipher-algo AES256 \
                -o backup/secrets.txt.gpg backup/secrets.txt
            # Удаляем открытый текст
            shred -u backup/secrets.txt
            echo "path=backup/secrets.txt.gpg" >> $GITHUB_OUTPUT
          else
            echo "path=backup/secrets.txt" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ steps.maybe_encrypt.outputs.path }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention_days }}
